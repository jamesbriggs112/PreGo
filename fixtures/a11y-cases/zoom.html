<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zoom</title>
  <style>body { font-family: Arial, sans-serif; margin: 0; } main { padding: 16px; } .skip { position: absolute; left: -999px; } .skip:focus { left: 8px; top: 8px; }</style>

</head>
<body>
  <main><h1>Zoom</h1>
  <!-- DEFECT: a fixed-size box hides its text when the page is zoomed to 200% (WCAG 1.4.4). -->
  <div id="banner" style="width:50vw;height:22px;overflow:hidden;border:1px solid #999">Opening hours change over the holidays: check before you travel.</div></main>
</body>
</html>
