    <h1>Contact us</h1>
    <!-- DEFECT: form fields without labels -->

      <p>Your name</p>
      <!-- DEFECT: no label at all (axe: label) -->
      <p><input type="text" name="name"></p>
      <!-- DEFECT: placeholder only, no label. axe accepts placeholder as a name, so it doesn't flag this. -->

      <!-- DEFECT: no label (axe: select-name) -->
      <p><select name="topic"><option>Sales</option><option>Support</option></select></p>
      <!-- DEFECT: no label at all (axe: label) -->
      <p><textarea name="message" rows="5" cols="40"></textarea></p>
      <p><button type="submit">Send</button></p>
    </form>
