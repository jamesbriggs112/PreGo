</head>
<body>
  <main>
    <h1>Embedded frames</h1>
    <!-- An embedded form frame with no language of its own: the problem is in the frame, not this page. -->
    <iframe class="hs-form-iframe" title="Contact form" srcdoc="<!DOCTYPE html><html><head><title>Form</title></head><body><p>Fill in the form</p></body></html>"></iframe>
    <!-- An unlabelled SVG icon. -->
    <p><a href="#top"><svg id="icon" viewBox="0 0 8 9" height="9" width="8" xmlns="http://www.w3.org/2000/svg"><path d="M0 0h8v9H0z"/></svg> Back to top</a></p>
  </main>
</body>
</html>
