<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tracks too early</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PREGOTEST"></script>
    <script>
      // Sets analytics cookies straight away, as a misconfigured tag would.
      document.cookie = '_ga=GA1.1.123456.1700000000; path=/';
      document.cookie = '_fbp=fb.1.1700000000.123456; path=/';
      document.cookie = 'session=abc; path=/';
    </script>
  </head>
  <body>
    <div role="dialog" aria-label="Cookies"><p>We use cookies.</p><button>Accept</button><button>Reject</button></div>
    <main>
      <h1>A site that tracks before consent</h1>
      <img src="https://www.facebook.com/tr?id=1&amp;ev=PageView&amp;noscript=1" alt="" width="1" height="1" />
    </main>
  </body>
</html>
